name: UI checks
run-name: UI checks (${{ github.event_name == 'push' && 'warning-proof' || inputs.browser_scope || 'all' }})
on:
  pull_request:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      browser_scope:
        description: 'Browser coverage (full suite remains the default PR check)'
        type: choice
        default: all
        options:
          - all
          - warning-proof
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npm test
        working-directory: ui
      - name: Browser flows and advisory visual measurements
        env:
          BROWSER_SCOPE: ${{ github.event_name == 'push' && 'warning-proof' || inputs.browser_scope }}
        run: |
          if [ "$BROWSER_SCOPE" = warning-proof ]; then
            npx playwright test visual-warning.spec.ts
          else
            npm run test:browser
          fi
        working-directory: ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-evidence
          path: |
            ui/playwright-report/
            ui/test-results/visual-warnings.json
            /tmp/brain-ui-playwright/
          if-no-files-found: error
