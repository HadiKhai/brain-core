name: Full suite

on:
  workflow_dispatch:
  push:
    branches: ['ci/**']

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build Python 3.9 with native Linux ownership APIs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev libbz2-dev \
            libreadline-dev libsqlite3-dev libffi-dev liblzma-dev libcrypt-dev
          # CPython v3.9.25, pinned to its release commit. Build once for all shards.
          curl --fail --location --retry 3 \
            https://github.com/python/cpython/archive/0bbaf5de9744ae1acea3e2c9ad2257d1cc68e847.tar.gz \
            --output "$RUNNER_TEMP/cpython.tar.gz"
          mkdir "$RUNNER_TEMP/cpython"
          tar -xzf "$RUNNER_TEMP/cpython.tar.gz" -C "$RUNNER_TEMP/cpython" --strip-components=1
          cd "$RUNNER_TEMP/cpython"
          ./configure --prefix="$RUNNER_TEMP/python39" --with-ensurepip=install CFLAGS='-O2 -std=gnu11'
          make -j"$(nproc)"
          make install
          ln -s python3.9 "$RUNNER_TEMP/python39/bin/python"
          "$RUNNER_TEMP/python39/bin/python" -c 'import os, signal, ssl; assert hasattr(os, "pidfd_open") and hasattr(signal, "pidfd_send_signal")'
          echo "$RUNNER_TEMP/python39/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements-test.txt
      - name: Package pinned Python and test dependencies
        run: tar -czf "$RUNNER_TEMP/python39.tar.gz" -C "$RUNNER_TEMP" python39
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-runtime
          path: ${{ runner.temp }}/python39.tar.gz
          if-no-files-found: error
      - name: Assert disjoint and complete file partition
        run: python -B tools/ci_shard.py plan --plan "$RUNNER_TEMP/plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inventory
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error

  suite:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-runtime
          path: ${{ runner.temp }}/runtime
      - name: Restore Python 3.9
        run: |
          tar -xzf "$RUNNER_TEMP/runtime/python39.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/python39/bin" >> "$GITHUB_PATH"
      - name: Configure synthetic commit identity
        run: |
          git config --global user.name 'Brain CI'
          git config --global user.email 'brain-ci@example.invalid'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: inventory
          path: ${{ runner.temp }}/inventory
      - name: Run shard
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          python -B tools/ci_shard.py run --plan "$RUNNER_TEMP/inventory/plan.json"
          --shard "$SHARD" --output "$RUNNER_TEMP/shard-$SHARD"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}/
          if-no-files-found: error

  summary:
    if: always()
    needs: [inventory, suite]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/results
      - name: Print aggregate and per-shard results
        shell: bash
        run: |
          set -o pipefail
          tar -xzf "$RUNNER_TEMP/results/python-runtime/python39.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/python39/bin/python" -B tools/ci_summary.py --results "$RUNNER_TEMP/results" \
            --plan "$RUNNER_TEMP/results/inventory/plan.json" | tee -a "$GITHUB_STEP_SUMMARY"
