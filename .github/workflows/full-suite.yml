name: Full suite

on:
  workflow_dispatch:
  push:
    branches: ['ci/**']

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Install Python 3.9
        run: |
          # Standalone Python remains available as ubuntu-latest advances.
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/pythons"
          export UV_CACHE_DIR="$RUNNER_TEMP/uv-cache"
          uv python install 3.9
          uv venv --python 3.9 "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - run: uv pip install --python "$RUNNER_TEMP/ci-venv/bin/python" -r requirements-test.txt
      - name: Assert disjoint and complete file partition
        run: python -B tools/ci_shard.py plan --plan "$RUNNER_TEMP/plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inventory
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error

  suite:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Install Python 3.9
        run: |
          # Standalone Python remains available as ubuntu-latest advances.
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/pythons"
          export UV_CACHE_DIR="$RUNNER_TEMP/uv-cache"
          uv python install 3.9
          uv venv --python 3.9 "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - run: uv pip install --python "$RUNNER_TEMP/ci-venv/bin/python" -r requirements-test.txt
      - name: Configure synthetic commit identity
        run: |
          git config --global user.name 'Brain CI'
          git config --global user.email 'brain-ci@example.invalid'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: inventory
          path: ${{ runner.temp }}/inventory
      - name: Run shard
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          python -B tools/ci_shard.py run --plan "$RUNNER_TEMP/inventory/plan.json"
          --shard "$SHARD" --output "$RUNNER_TEMP/shard-$SHARD"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}/
          if-no-files-found: error

  summary:
    if: always()
    needs: [inventory, suite]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Install Python 3.9
        run: |
          # Standalone Python remains available as ubuntu-latest advances.
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/pythons"
          export UV_CACHE_DIR="$RUNNER_TEMP/uv-cache"
          uv python install 3.9
          uv venv --python 3.9 "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/results
      - name: Print aggregate and per-shard results
        shell: bash
        run: |
          set -o pipefail
          python -B tools/ci_summary.py --results "$RUNNER_TEMP/results" \
            --plan "$RUNNER_TEMP/results/inventory/plan.json" | tee -a "$GITHUB_STEP_SUMMARY"
